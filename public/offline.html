<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#51458c" />
    <title>Sem conexão — Invest Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fa;
        color: #252737;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e6e8ef;
        border-radius: 16px;
        padding: 32px;
      }
      img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        font-size: 25px;
        margin: 24px 0 12px;
      }
      p {
        color: #666a7e;
        font-size: 14px;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 18px;
        background: #51458c;
        color: white;
        border-radius: 8px;
        text-decoration: none;
      }
      a:hover {
        background: #413670;
      }
      a:focus-visible {
        outline: 3px solid #51458c;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão.</h1>
      <p>
        Conecte-se à internet para entrar ou reabrir a calculadora. Sua carteira
        e os cenários salvos continuam neste navegador.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
